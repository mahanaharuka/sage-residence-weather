# Goes in .github/workflows of the repository that serves the weather file. The Japan Meteorological Agency announces at 05, 11 and 17 JST.
name: update weather
on:
  schedule:
    - cron: "25 20,2,8 * * *"
    # just after midnight, so that the first day in the file is today
    - cron: "5 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_weather.py weather.txt
      - run: |
          git config user.name "weather"
          git config user.email "weather@users.noreply.github.com"
          git add weather.txt
          git diff --cached --quiet || git commit -m "weather"
          git push
